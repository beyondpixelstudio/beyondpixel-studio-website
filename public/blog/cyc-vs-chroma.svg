<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Side-by-side: a cyclorama cove curving from wall to floor with its own background lights so the background disappears, and a chroma green backdrop with the subject standing at least two metres clear so the background can be replaced">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#16121F"/><stop offset="1" stop-color="#0A0814"/></linearGradient>
<linearGradient id="cove" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7f6fa"/><stop offset="1" stop-color="#e3e1ea"/></linearGradient>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F2704A"/></marker>
<style>
.t{font-family:'DM Sans',system-ui,sans-serif;fill:#FAFAF8}
.m{font-family:'DM Mono',ui-monospace,monospace;fill:#ADA6C8}
.lbl{font-family:'DM Sans',system-ui,sans-serif;fill:#F2704A;letter-spacing:2.6px}
.beam{fill:#F2D9A6;opacity:.16}
</style>
</defs>
<rect width="1200" height="675" fill="#05040B"/>
<text class="lbl" x="60" y="58" font-size="15" font-weight="700">TWO FLOORS, OPPOSITE JOBS</text>

<rect x="60" y="86" width="520" height="440" rx="16" fill="url(#g)" stroke="#FAFAF8" stroke-opacity=".1"/>
<text class="t" x="88" y="126" font-size="23" font-weight="700">Cyclorama</text>
<text class="m" x="88" y="152" font-size="16">the background disappears</text>
<path d="M150 190 L150 380 Q150 450 220 450 L550 450 L550 480 L150 480 Z" fill="url(#cove)"/>
<path d="M150 190 L150 380 Q150 450 220 450 L550 450" fill="none" stroke="#bdb8cc" stroke-width="2"/>
<text class="m" x="168" y="428" font-size="14" style="fill:#6b6484">no corner</text>
<polygon class="beam" points="300,196 176,300 176,420 300,262"/>
<polygon class="beam" points="470,196 350,300 470,420 520,262"/>
<g fill="#D9A441"><rect x="286" y="182" width="30" height="18" rx="3"/><rect x="456" y="182" width="30" height="18" rx="3"/></g>
<text class="m" x="330" y="196" font-size="14">cove lights</text>
<circle cx="400" cy="346" r="16" fill="#2a2440"/><rect x="384" y="364" width="32" height="86" rx="12" fill="#2a2440"/>
<g fill="#D9A441"><rect x="520" y="330" width="26" height="16" rx="3"/></g><text class="m" x="494" y="322" font-size="14">key</text>
<text class="t" x="88" y="506" font-size="17" font-weight="600">Clean white or grey, nothing added later</text>

<rect x="620" y="86" width="520" height="440" rx="16" fill="url(#g)" stroke="#FAFAF8" stroke-opacity=".1"/>
<text class="t" x="648" y="126" font-size="23" font-weight="700">Chroma key</text>
<text class="m" x="648" y="152" font-size="16">the background is replaced</text>
<rect x="690" y="190" width="120" height="290" fill="#2FBF5B" opacity=".85"/>
<polygon class="beam" points="700,196 816,262 816,420 700,420"/>
<g fill="#D9A441"><rect x="852" y="200" width="30" height="18" rx="3"/><rect x="852" y="420" width="30" height="18" rx="3"/></g>
<text class="m" x="896" y="214" font-size="14">even, flat light</text>
<text class="m" x="896" y="234" font-size="14">on the screen</text>
<circle cx="1010" cy="346" r="16" fill="#2a2440"/><rect x="994" y="364" width="32" height="86" rx="12" fill="#2a2440"/>
<g fill="#D9A441"><rect x="1080" y="330" width="26" height="16" rx="3"/></g><text class="m" x="1062" y="322" font-size="14">key</text>
<path d="M818 470 L990 470" stroke="#F2704A" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
<text class="t" x="860" y="462" font-size="17" font-weight="700" style="fill:#F2704A">2 m or more</text>
<text class="t" x="648" y="506" font-size="17" font-weight="600">Location, graphics or virtual set, in post</text>

<line x1="60" y1="560" x2="1140" y2="560" stroke="#FAFAF8" stroke-opacity=".08"/>
<text class="m" x="60" y="598" font-size="16">Cove: lit about a stop brighter than the subject, so it records pure white without spilling back.</text>
<text class="m" x="60" y="626" font-size="16">Chroma: screen and subject lit separately; distance keeps green spill off hair and shoulders.</text>
</svg>
